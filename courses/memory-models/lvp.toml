[course]
title = "How Memory Models Schedule Your Reviews"
language = "en"   # narration and on-screen text
series = "How Memory Models Schedule Your Reviews · Video {n}"

[video]
theme = "paper"           # paper | night | terminal

[voice]
provider = "openrouter"   # openrouter (Gemini TTS, needs OPENROUTER_API_KEY) | silent
model = "google/gemini-3.8-flash-tts"
voice = "Kore"
speed = 1.15              # applied locally, free to change
chars_per_second = 15.0

[budget]
max_usd_per_run = 1.50    # the OpenRouter key itself is capped at $2 for this course

[pronunciation]
# respellings for the voice only, e.g.  SQL = "sequel"   "e.g." = "for example"
