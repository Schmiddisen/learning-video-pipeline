<title>__COURSE_TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@400;600&display=swap">
<script type="application/json" id="claude-artifacts-manifest">{"permissions": ["full-access", "notifications"]}</script>
<style>
/* Layout: a viewing desk. Left: the video, its live transcript and the questions it asks,
   which interrupt in place under the picture. Right: the tutor, the video map, today's
   review, the lab and the course – one tab each. */
:root {
  --bg: #e9ecef; --surface: #ffffff; --sunk: #f4f6f8; --ink: #18212c; --muted: #5b6878;
  --line: #d3d9e0; --accent: #a8650e; --accent-soft: #f6e9d3; --good: #23704f;
  --good-soft: #def0e6; --warn: #8a5a00; --warn-soft: #fbefd5; --bad: #a83246; --bad-soft: #f8e1e5;
  --pen: #e0185f; --stage: #0e131a; --code-bg: #0f1720; --code-ink: #dfe7ef;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible Next", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141a; --surface: #171e27; --sunk: #121820; --ink: #e5eaf0; --muted: #94a2b3;
    --line: #2a3543; --accent: #e3a43f; --accent-soft: #33271a; --good: #5cc490; --good-soft: #17302a;
    --warn: #e9b84f; --warn-soft: #33290f; --bad: #f07a8c; --bad-soft: #3a1a21; --pen: #ff3d84;
    --stage: #05080c; --code-bg: #0a0f15; --code-ink: #dfe7ef; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141a; --surface: #171e27; --sunk: #121820; --ink: #e5eaf0; --muted: #94a2b3;
  --line: #2a3543; --accent: #e3a43f; --accent-soft: #33271a; --good: #5cc490; --good-soft: #17302a;
  --warn: #e9b84f; --warn-soft: #33290f; --bad: #f07a8c; --bad-soft: #3a1a21; --pen: #ff3d84;
  --stage: #05080c; --code-bg: #0a0f15; --code-ink: #dfe7ef; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 28px;
}
button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
h2.h { font: 700 16px/1.25 var(--f-display); margin: 0; }

header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; max-width: 1480px; margin: 0 auto 12px; }
.brand { font: 700 20px/1.1 var(--f-display); letter-spacing: -0.01em; margin: 0; }
.brand small { display: block; font: 600 11px/1.4 var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.picker { flex: 1 1 320px; min-width: 0; display: flex; gap: 6px; align-items: center; }
.picker select { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; line-height: 1; }
.iconbtn:hover { border-color: var(--muted); }
.iconbtn[aria-pressed="true"] { background: var(--pen); border-color: var(--pen); color: #fff; }
.iconbtn:disabled { opacity: .45; cursor: default; }
.duepill { border: 1px solid var(--accent); color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 600; }

main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 16px; max-width: 1480px; margin: 0 auto; align-items: start; }
@media (max-width: 1020px) { main { grid-template-columns: minmax(0, 1fr); } }

.stage { position: relative; background: var(--stage); border-radius: var(--r); overflow: hidden; aspect-ratio: 16 / 9; max-width: 100%; }
.stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage canvas { touch-action: none; pointer-events: none; }
.stage.drawing canvas { pointer-events: auto; cursor: crosshair; }
.stage .badge { position: absolute; left: 10px; top: 10px; background: var(--pen); color: #fff; font: 600 12px/1 var(--f-body); padding: 6px 8px; border-radius: 6px; }
.stage .bigplay { position: absolute; inset: 0; margin: auto; width: 74px; height: 74px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 26px; }
.stage:fullscreen { border-radius: 0; aspect-ratio: auto; }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 10px; }
.controls .time { font-size: 13px; color: var(--muted); min-width: 108px; }
.scrub { position: relative; flex: 1 1 260px; min-width: 0; height: 28px; }
.scrub input { width: 100%; height: 28px; margin: 0; accent-color: var(--accent); background: transparent; }
.scrub .marks { position: absolute; left: 7px; right: 7px; top: 0; height: 6px; pointer-events: none; }
.scrub .mk { position: absolute; top: 0; width: 2px; height: 6px; background: var(--muted); opacity: .6; transform: translateX(-1px); }
.scrub .mk.q { background: var(--accent); opacity: 1; width: 6px; height: 6px; border-radius: 50%; transform: translateX(-3px); }
.scrub .mk.n { background: var(--good); opacity: 1; width: 6px; height: 6px; border-radius: 1px; transform: translateX(-3px); }
.controls select { padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.where { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; margin: 10px 0 0; color: var(--muted); font-size: 13px; }
.where strong { color: var(--ink); font-weight: 600; }

/* the card under the picture: questions, practice, explain-back */
.card { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; }
.kicker { font: 700 12px/1 var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin: 0; }
.q { font-size: 17px; margin: 0; white-space: pre-line; }
.card textarea, .field { width: 100%; min-height: 64px; resize: vertical; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); }
.ref { background: var(--good-soft); border-radius: 8px; padding: 10px 12px; white-space: pre-line; }
.ref b { display: block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--good); }
.mine { color: var(--muted); white-space: pre-line; margin: 0; }
.verdict { border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; background: var(--sunk); }
.verdict.right { background: var(--good-soft); }
.verdict.partly { background: var(--warn-soft); }
.verdict.wrong { background: var(--bad-soft); }
.verdict b { display: block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 600; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #1a1206; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #1a1206; } }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
label.switch { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.ts { font-family: var(--f-mono); font-size: 13px; border: 1px solid var(--line); background: var(--sunk); border-radius: 5px; padding: 0 4px; color: var(--accent); }
.list-plain { margin: 0; padding-left: 18px; }

.transcript { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); max-height: 340px; overflow-y: auto; padding: 6px 0; }
.transcript h3 { font: 600 12px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 16px 6px; }
.line { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; padding: 5px 16px; border: 0; background: none; width: 100%; text-align: left; color: var(--muted); }
.line:hover { background: var(--sunk); }
.line .mono { font-size: 12px; padding-top: 2px; }
.line.now { color: var(--ink); background: var(--accent-soft); }
.line.now .w { color: var(--muted); }
.line .w.said, .line.now .w.said { color: var(--ink); }
.qline { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; padding: 5px 16px; color: var(--accent); font-weight: 600; font-size: 14px; }

aside { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; min-height: 560px; max-height: calc(100vh - 100px); position: sticky; top: 12px; }
@media (max-width: 1020px) { aside { position: static; max-height: none; } }
.tabs { display: flex; flex-shrink: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { flex: 1 0 auto; border: 0; background: none; padding: 12px 10px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .count { font-size: 11px; background: var(--accent); color: #fff; border-radius: 999px; padding: 1px 6px; margin-left: 4px; }
.panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.chat { flex: 1; min-height: 200px; }
.msg { max-width: 100%; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.you { align-self: flex-end; background: var(--sunk); border: 1px solid var(--line); border-radius: 10px 10px 2px 10px; padding: 8px 12px; max-width: 88%; }
.msg.you .ctx { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.msg.you img { display: block; width: 160px; border-radius: 6px; margin-top: 6px; }
.msg.claude { line-height: 1.55; }
.msg .who { display: block; font: 700 12px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
.msg .acts { display: flex; gap: 6px; margin-top: 6px; }
.msg.err, .err { color: var(--bad); font-size: 14px; }
.empty { color: var(--muted); font-size: 14px; display: grid; gap: 8px; }
.empty b { color: var(--ink); }
.composer { border-top: 1px solid var(--line); padding: 10px 12px 12px; display: grid; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--sunk); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.composer textarea { width: 100%; min-height: 54px; max-height: 160px; resize: vertical; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); }
.ctxline { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.ctxline .pen { color: var(--pen); font-weight: 600; }
.item { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; padding: 8px 10px; border: 0; background: none; width: 100%; text-align: left; border-radius: 8px; }
.item:hover { background: var(--sunk); }
.item.now { background: var(--accent-soft); }
.item .sub { display: block; font-size: 13px; color: var(--muted); white-space: pre-line; }
.item .sub.ok { color: var(--good); }
.item .sub.no { color: var(--bad); }
.vid { grid-template-columns: minmax(0, 1fr) 64px; align-items: center; }
.bar { height: 6px; background: var(--sunk); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; display: block; }
.bar i { display: block; height: 100%; background: var(--good); }
.notice { padding: 10px 14px; border-radius: 8px; background: var(--accent-soft); font-size: 14px; }
.section-title { font: 700 12px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 6px 0 0; }
.today { display: grid; gap: 8px; }
.todo { display: grid; grid-template-columns: 24px minmax(0,1fr); gap: 8px; align-items: start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); text-align: left; width: 100%; }
.todo .n { font: 700 14px/1.3 var(--f-display); color: var(--accent); }

/* review */
.flash { border: 1px solid var(--line); border-radius: var(--r); padding: 18px; background: var(--sunk); display: grid; gap: 12px; }
.flash .front { font-size: 17px; white-space: pre-wrap; }
.flash .back { border-top: 1px dashed var(--line); padding-top: 12px; white-space: pre-wrap; }
.flash .extra { color: var(--muted); font-size: 14px; white-space: pre-wrap; }
.cloze-gap { background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 0 6px; font-weight: 700; }
.rates { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
.rates button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 4px; display: grid; gap: 2px; font-weight: 600; }
.rates button small { font-weight: 400; color: var(--muted); font-size: 12px; }
.rates button.again { border-color: var(--bad); }
.rates button.good { border-color: var(--good); }
.stats { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.stats b { color: var(--ink); }
.anki { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; font-size: 14px; }
.anki .state { font-weight: 600; }

/* lab */
.lab-goal { white-space: pre-wrap; }
.code { width: 100%; min-height: 220px; font: 13px/1.5 var(--f-mono); background: var(--code-bg); color: var(--code-ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; resize: vertical; tab-size: 4; white-space: pre; overflow: auto; }
.out { font: 13px/1.45 var(--f-mono); background: var(--code-bg); color: var(--code-ink); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; max-height: 220px; overflow: auto; margin: 0; }
.out.pass { outline: 2px solid var(--good); }
.out.fail { outline: 2px solid var(--bad); }
@media (prefers-reduced-motion: no-preference) { .line, .item { transition: background-color .2s; } }
</style>

<header class="top">
  <p class="brand"><small id="s-kicker">Course</small><span id="course-title">__COURSE_TITLE__</span></p>
  <div class="picker">
    <button class="iconbtn" id="prev" aria-label="Previous video">&#8592;</button>
    <select id="video-select" aria-label="Video"></select>
    <button class="iconbtn" id="next" aria-label="Next video">&#8594;</button>
  </div>
  <button class="duepill" id="due-pill" hidden></button>
</header>

<main>
  <section aria-label="Video">
    <div class="stage" id="stage">
      <video id="video" playsinline preload="metadata"></video>
      <canvas id="ink"></canvas>
      <span class="badge" id="draw-badge" hidden></span>
      <button class="bigplay" id="bigplay" aria-label="Play">&#9654;</button>
    </div>
    <div class="controls">
      <button class="iconbtn" id="play" aria-label="Play">&#9654;</button>
      <button class="iconbtn" id="back" aria-label="Back 10 seconds">&#8634; 10</button>
      <div class="scrub"><div class="marks" id="marks"></div><input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="Position"></div>
      <span class="time mono" id="time">0:00 / 0:00</span>
      <select id="speed" aria-label="Speed"><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>1.75</option><option>2</option></select>
      <button class="iconbtn" id="draw" aria-pressed="false">&#9998; <span id="s-draw">Mark</span></button>
      <button class="iconbtn" id="clear-ink" hidden>&#10005;</button>
      <button class="iconbtn" id="full" aria-label="Full screen">&#9974;</button>
    </div>
    <p class="where" id="where"></p>
    <div class="card" id="card" hidden aria-live="polite"></div>
    <div class="row" style="margin-top:10px; justify-content: space-between">
      <label class="switch"><input type="checkbox" id="stop-at-q" checked> <span id="s-stop">Pause at questions</span></label>
      <div class="row">
        <button class="btn small" id="practice-btn"></button>
        <button class="btn small" id="note-btn"></button>
        <button class="btn small" id="card-btn"></button>
      </div>
    </div>
    <div class="transcript" id="transcript" aria-label="Transcript"></div>
  </section>

  <aside>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-panel="ask" aria-selected="true"></button>
      <button role="tab" data-panel="map" aria-selected="false"></button>
      <button role="tab" data-panel="review" aria-selected="false"></button>
      <button role="tab" data-panel="lab" aria-selected="false"></button>
      <button role="tab" data-panel="course" aria-selected="false"></button>
    </div>
    <div class="panel" id="panel-ask">
      <div class="scroll chat" id="chat"></div>
      <div class="composer">
        <div class="chips" id="chips"></div>
        <div class="ctxline" id="ctxline"></div>
        <textarea id="ask-input" aria-label="Your question"></textarea>
        <div class="row">
          <button class="btn primary" id="ask-send"></button>
          <button class="btn" id="ask-stop" hidden></button>
          <button class="iconbtn" id="mic" hidden aria-pressed="false">&#127908;</button>
          <label class="switch"><input type="checkbox" id="with-frame" checked> <span id="s-frame">send the picture</span></label>
        </div>
      </div>
    </div>
    <div class="panel" id="panel-map" hidden><div class="scroll" id="map"></div></div>
    <div class="panel" id="panel-review" hidden><div class="scroll" id="review"></div></div>
    <div class="panel" id="panel-lab" hidden><div class="scroll" id="lab"></div></div>
    <div class="panel" id="panel-course" hidden><div class="scroll" id="course"></div></div>
  </aside>
</main>

<script src="fsrs.js"></script>
<script src="app.js"></script>
<script src="review.js"></script>
<script src="labs.js"></script>
<script src="exam.js"></script>
