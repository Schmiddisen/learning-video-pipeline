<style>
/* Layout: a viewing desk – the video and its live transcript on the left, a tutor you can ask
   on the right; questions from the video interrupt in place, under the picture. */
:root {
  --bg: #e9ecef;
  --surface: #ffffff;
  --sunk: #f4f6f8;
  --ink: #18212c;
  --muted: #5b6878;
  --line: #d3d9e0;
  --accent: #a8650e;
  --accent-soft: #f6e9d3;
  --good: #23704f;
  --good-soft: #def0e6;
  --bad: #a83246;
  --pen: #e0185f;
  --stage: #0e131a;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible Next", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141a; --surface: #171e27; --sunk: #121820; --ink: #e5eaf0; --muted: #94a2b3;
    --line: #2a3543; --accent: #e3a43f; --accent-soft: #33271a; --good: #5cc490;
    --good-soft: #17302a; --bad: #f07a8c; --pen: #ff3d84; --stage: #05080c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141a; --surface: #171e27; --sunk: #121820; --ink: #e5eaf0; --muted: #94a2b3;
  --line: #2a3543; --accent: #e3a43f; --accent-soft: #33271a; --good: #5cc490;
  --good-soft: #17302a; --bad: #f07a8c; --pen: #ff3d84; --stage: #05080c; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 28px;
}
button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; max-width: 1480px; margin: 0 auto 12px; }
.brand { font: 700 20px/1.1 var(--f-display); letter-spacing: -0.01em; margin: 0; }
.brand small { display: block; font: 600 11px/1.4 var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.picker { flex: 1 1 320px; min-width: 0; display: flex; gap: 6px; align-items: center; }
.picker select { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; line-height: 1; }
.iconbtn:hover { border-color: var(--muted); }
.iconbtn[aria-pressed="true"] { background: var(--pen); border-color: var(--pen); color: #fff; }
.overall { font-size: 13px; color: var(--muted); }

main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; max-width: 1480px; margin: 0 auto; align-items: start; }
@media (max-width: 980px) { main { grid-template-columns: minmax(0, 1fr); } }

/* stage */
.stage { position: relative; background: var(--stage); border-radius: var(--r); overflow: hidden; aspect-ratio: 16 / 9; max-width: 100%; }
.stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage canvas { touch-action: none; pointer-events: none; }
.stage.drawing canvas { pointer-events: auto; cursor: crosshair; }
.stage .badge { position: absolute; left: 10px; top: 10px; background: var(--pen); color: #fff; font: 600 12px/1 var(--f-body); padding: 6px 8px; border-radius: 6px; }
.stage .bigplay { position: absolute; inset: 0; margin: auto; width: 74px; height: 74px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 26px; }
.stage:fullscreen { border-radius: 0; aspect-ratio: auto; }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 10px; }
.controls .time { font-size: 13px; color: var(--muted); min-width: 108px; }
.scrub { position: relative; flex: 1 1 260px; min-width: 0; height: 28px; }
.scrub input { width: 100%; height: 28px; margin: 0; accent-color: var(--accent); background: transparent; }
.scrub .marks { position: absolute; left: 7px; right: 7px; top: 0; height: 6px; pointer-events: none; }
.scrub .mk { position: absolute; top: 0; width: 2px; height: 6px; background: var(--muted); opacity: .6; transform: translateX(-1px); }
.scrub .mk.q { background: var(--accent); opacity: 1; width: 6px; height: 6px; border-radius: 50%; transform: translateX(-3px); }
.controls select { padding: 6px 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.where { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; margin: 10px 0 0; color: var(--muted); font-size: 13px; }
.where strong { color: var(--ink); font-weight: 600; }

/* question card */
.quiz { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; }
.quiz .kicker { font: 700 12px/1 var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin: 0; }
.quiz .q { font-size: 17px; margin: 0; white-space: pre-line; }
.quiz textarea { width: 100%; min-height: 64px; resize: vertical; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); }
.quiz .ref { background: var(--good-soft); border-radius: 8px; padding: 10px 12px; white-space: pre-line; }
.quiz .ref b { display: block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--good); }
.quiz .mine { color: var(--muted); white-space: pre-line; }
.quiz .verdict { white-space: pre-wrap; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 600; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #1a1206; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #1a1206; } }
.btn:disabled { opacity: .5; cursor: default; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
label.switch { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }

/* transcript */
.transcript { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); max-height: 340px; overflow-y: auto; padding: 6px 0; }
.transcript h3 { font: 600 12px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 16px 6px; }
.line { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; padding: 5px 16px; border: 0; background: none; width: 100%; text-align: left; color: var(--muted); }
.line:hover { background: var(--sunk); }
.line .mono { font-size: 12px; padding-top: 2px; }
.line.now { color: var(--ink); background: var(--accent-soft); }
.line .w.said { color: var(--ink); }
.line.now .w { color: var(--muted); }
.line.now .w.said { color: var(--ink); }
.qline { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; padding: 5px 16px; color: var(--accent); font-weight: 600; font-size: 14px; }

/* side */
aside { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; min-height: 520px; max-height: calc(100vh - 100px); position: sticky; top: 12px; }
@media (max-width: 980px) { aside { position: static; max-height: none; } }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; background: none; padding: 12px 8px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.chat { flex: 1; min-height: 200px; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 100%; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.you { align-self: flex-end; background: var(--sunk); border: 1px solid var(--line); border-radius: 10px 10px 2px 10px; padding: 8px 12px; max-width: 88%; }
.msg.you .ctx { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.msg.you img { display: block; width: 160px; border-radius: 6px; margin-top: 6px; }
.msg.claude { line-height: 1.55; }
.msg.claude .who { display: block; font: 700 12px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
.msg.err { color: var(--bad); font-size: 14px; }
.ts { font-family: var(--f-mono); font-size: 13px; border: 1px solid var(--line); background: var(--sunk); border-radius: 5px; padding: 0 4px; color: var(--accent); }
.empty { color: var(--muted); font-size: 14px; display: grid; gap: 8px; }
.empty b { color: var(--ink); }
.composer { border-top: 1px solid var(--line); padding: 10px 12px 12px; display: grid; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--sunk); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
.chip:hover { border-color: var(--accent); }
.composer textarea { width: 100%; min-height: 54px; max-height: 160px; resize: vertical; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); }
.ctxline { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.ctxline .pen { color: var(--pen); font-weight: 600; }
.list { overflow-y: auto; padding: 8px 0; }
.item { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; padding: 8px 16px; border: 0; background: none; width: 100%; text-align: left; }
.item:hover { background: var(--sunk); }
.item.now { background: var(--accent-soft); }
.item .sub { display: block; font-size: 13px; color: var(--muted); white-space: pre-line; }
.item .sub.ok { color: var(--good); }
.vids .item { grid-template-columns: minmax(0, 1fr) 64px; align-items: center; }
.bar { height: 6px; background: var(--sunk); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--good); }
.notice { padding: 10px 14px; border-radius: 8px; background: var(--accent-soft); font-size: 14px; }
@media (prefers-reduced-motion: no-preference) { .line, .item { transition: background-color .2s; } }
</style>

<header class="top">
  <p class="brand"><small id="s-kicker">Course</small><span id="course-title">__COURSE_TITLE__</span></p>
  <div class="picker">
    <button class="iconbtn" id="prev" aria-label="Previous video">&#8592;</button>
    <select id="video-select" aria-label="Video"></select>
    <button class="iconbtn" id="next" aria-label="Next video">&#8594;</button>
  </div>
  <span class="overall" id="overall"></span>
</header>

<main>
  <section aria-label="Video">
    <div class="stage" id="stage">
      <video id="video" playsinline preload="metadata"></video>
      <canvas id="ink"></canvas>
      <span class="badge" id="draw-badge" hidden>Draw on the picture, then ask</span>
      <button class="bigplay" id="bigplay" aria-label="Play">&#9654;</button>
    </div>
    <div class="controls">
      <button class="iconbtn" id="play" aria-label="Play">&#9654;</button>
      <button class="iconbtn" id="back" aria-label="Back 10 seconds">&#8634; 10</button>
      <div class="scrub"><div class="marks" id="marks"></div><input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="Position"></div>
      <span class="time mono" id="time">0:00 / 0:00</span>
      <select id="speed" aria-label="Speed"><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>1.75</option><option>2</option></select>
      <button class="iconbtn" id="draw" aria-pressed="false" title="Draw on the picture (D)">&#9998; <span id="s-draw">Mark</span></button>
      <button class="iconbtn" id="clear-ink" title="Clear marks" hidden>&#10005;</button>
      <button class="iconbtn" id="full" aria-label="Full screen">&#9974;</button>
    </div>
    <p class="where" id="where"></p>
    <div class="quiz" id="quiz" hidden aria-live="polite">
      <p class="kicker" id="quiz-kind"></p>
      <p class="q" id="quiz-q"></p>
      <textarea id="quiz-input" aria-label="Your answer"></textarea>
      <div class="row" id="quiz-ask-row">
        <button class="btn primary" id="quiz-submit"></button>
        <button class="btn" id="quiz-skip"></button>
      </div>
      <div id="quiz-result" hidden>
        <p class="mine" id="quiz-mine"></p>
        <div class="ref" id="quiz-ref" hidden><b id="s-ref">From the video</b><span id="quiz-a"></span></div>
        <p class="verdict" id="quiz-verdict" hidden></p>
        <div class="row" style="margin-top:10px">
          <button class="btn" id="quiz-grade"></button>
          <button class="btn primary" id="quiz-continue"></button>
        </div>
      </div>
    </div>
    <label class="switch" style="margin-top:10px"><input type="checkbox" id="stop-at-q" checked> <span id="s-stop">Pause at questions and let me answer</span></label>
    <div class="transcript" id="transcript" aria-label="Transcript"></div>
  </section>

  <aside>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-ask" aria-selected="true"></button>
      <button role="tab" id="tab-map" aria-selected="false"></button>
      <button role="tab" id="tab-course" aria-selected="false"></button>
    </div>
    <div class="panel" id="panel-ask">
      <div class="chat" id="chat"></div>
      <div class="composer">
        <div class="chips" id="chips"></div>
        <div class="ctxline" id="ctxline"></div>
        <textarea id="ask-input" aria-label="Your question"></textarea>
        <div class="row">
          <button class="btn primary" id="ask-send"></button>
          <button class="btn" id="ask-stop" hidden></button>
          <button class="iconbtn" id="mic" hidden aria-pressed="false" title="Dictate">&#127908;</button>
          <label class="switch"><input type="checkbox" id="with-frame" checked> <span id="s-frame">send the picture</span></label>
        </div>
      </div>
    </div>
    <div class="panel" id="panel-map" hidden><div class="list" id="map"></div></div>
    <div class="panel" id="panel-course" hidden><div class="list vids" id="course"></div></div>
  </aside>
</main>

<script>
"use strict";
const STR = {
  en: {
    kicker: "Course", ask: "Ask", map: "This video", course: "All videos", mark: "Mark",
    drawBadge: "Draw on the picture, then ask", send: "Ask", stop: "Stop", frame: "send the picture",
    stopAtQ: "Pause at questions and let me answer",
    pretest: "Guess first", check: "Quick check", recall: "Recall",
    submitGuess: "Lock in my guess", submit: "Check my answer", skip: "Skip",
    cont: "Continue the video", grade: "Ask Claude about my answer", fromVideo: "From the video",
    yourAnswer: "Your answer: ", noAnswer: "(no answer)", guessSaved: "Your guess is saved – the video answers it.",
    placeholder: "Ask about this moment – or anything in the course…",
    quizPlaceholder: "Type your answer – a sentence is enough",
    chips: ["Explain this differently", "Give me a concrete example", "Why does this matter?", "What did I just miss?"],
    emptyTitle: "Pause anywhere and ask.",
    emptyBody: "Claude sees the current picture, what was just said and the whole video. Press Mark to circle something on the picture first.",
    thinking: "Thinking…", you: "You", claude: "Claude",
    at: "at", chapter: "Chapter", marked: "your marking", picture: "picture",
    resumed: "Resumed at", startOver: "Start over", unavailable: "Asking Claude is not available in this view – open the artifact on claude.ai or in the Claude app.",
    errors: {
      not_granted: "Claude isn't allowed for this page. You can allow it in the page's Permissions menu.",
      sampling_disabled: "Claude isn't available for this account.",
      rate_limited: "Too many questions at once or a usage limit reached – try again in a moment.",
      session_expired: "Please sign in again.", refused: "Claude declined this one – try rephrasing it.",
      image_rejected: "The picture couldn't be sent – try again without it.",
      images_unavailable: "Pictures can't be sent from this view; asking without it.",
      prompt_too_large: "That was too much at once – ask about a shorter part.",
      other: "Something went wrong on the way to Claude – try again."
    },
    gradePrompt: "Is this answer right?", watched: "watched", answered: "answered", loadError: "course.json could not be loaded.",
    stored: "Progress is saved to your account.", local: "Progress is saved in this browser."
  },
  de: {
    kicker: "Kurs", ask: "Fragen", map: "Dieses Video", course: "Alle Videos", mark: "Markieren",
    drawBadge: "Ins Bild zeichnen, dann fragen", send: "Fragen", stop: "Stopp", frame: "Bild mitschicken",
    stopAtQ: "Bei Fragen anhalten und mich antworten lassen",
    pretest: "Erst raten", check: "Kurz prüfen", recall: "Zum Abrufen",
    submitGuess: "Tipp festhalten", submit: "Antwort prüfen", skip: "Überspringen",
    cont: "Video fortsetzen", grade: "Claude zu meiner Antwort fragen", fromVideo: "Aus dem Video",
    yourAnswer: "Deine Antwort: ", noAnswer: "(keine Antwort)", guessSaved: "Dein Tipp ist gespeichert – das Video löst ihn auf.",
    placeholder: "Frag zu dieser Stelle – oder zu allem im Kurs …",
    quizPlaceholder: "Antwort eintippen – ein Satz genügt",
    chips: ["Erklär das anders", "Gib mir ein konkretes Beispiel", "Wozu brauche ich das?", "Was habe ich gerade verpasst?"],
    emptyTitle: "Halte irgendwo an und frag.",
    emptyBody: "Claude sieht das aktuelle Bild, was gerade gesagt wurde und das ganze Video. Mit Markieren kannst du vorher etwas im Bild einkreisen.",
    thinking: "Denkt nach …", you: "Du", claude: "Claude",
    at: "bei", chapter: "Kapitel", marked: "deine Markierung", picture: "Bild",
    resumed: "Fortgesetzt bei", startOver: "Von vorn", unavailable: "Claude fragen geht in dieser Ansicht nicht – öffne das Artefakt auf claude.ai oder in der Claude-App.",
    errors: {
      not_granted: "Claude ist für diese Seite nicht erlaubt. Das lässt sich im Berechtigungsmenü der Seite ändern.",
      sampling_disabled: "Claude ist für dieses Konto nicht verfügbar.",
      rate_limited: "Zu viele Fragen auf einmal oder Nutzungslimit erreicht – gleich noch einmal versuchen.",
      session_expired: "Bitte neu anmelden.", refused: "Claude hat das abgelehnt – anders formulieren.",
      image_rejected: "Das Bild ließ sich nicht senden – ohne Bild noch einmal versuchen.",
      images_unavailable: "Bilder gehen in dieser Ansicht nicht; frage ohne Bild.",
      prompt_too_large: "Das war zu viel auf einmal – frag nach einem kürzeren Teil.",
      other: "Auf dem Weg zu Claude ist etwas schiefgegangen – noch einmal versuchen."
    },
    gradePrompt: "Stimmt diese Antwort?", watched: "gesehen", answered: "beantwortet", loadError: "course.json konnte nicht geladen werden.",
    stored: "Fortschritt wird in deinem Konto gespeichert.", local: "Fortschritt wird in diesem Browser gespeichert."
  }
};
let L = STR.en;
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const fmt = (s) => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = String(s % 60).padStart(2, "0"); return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`; };
const hashId = (id) => id.replace(/[^A-Za-z0-9-]/g, "-");

const video = $("video"), ink = $("ink"), stage = $("stage");
let course = null, cur = null, curIndex = 0;
let sample = null, dictation = null, db = null, uid = null;
const progress = {};            // video id -> {pos, furthest, answers: {key: {text, verdict}}}
const chats = {};               // video id -> [{role, content, view}]
let strokes = [], drawing = false;
let lastT = 0, activeLine = -1, quizOpen = null, askCtl = null;
let sampleChecked = false, imagesOk = false;

/* ---------- progress: account storage when available, else this browser ---------- */
const LS_KEY = "lvp-progress";
function lsRead() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch { return {}; } }
function lsWrite(all) { try { localStorage.setItem(LS_KEY, JSON.stringify(all)); } catch { /* private mode */ } }
const saveTimers = {};
function saveSoon(id, now = false) {
  clearTimeout(saveTimers[id]);
  saveTimers[id] = setTimeout(() => saveProgress(id), now ? 0 : 4000);
}
let writing = Promise.resolve();
async function saveProgress(id) {
  const p = progress[id]; if (!p) return;
  const all = lsRead(); all[id] = p; all._last = cur?.id; lsWrite(all);
  if (db && uid) {
    writing = writing.then(() => db.collection("data/users/" + uid).doc("p-" + hashId(id))
      .set({ video: id, pos: p.pos || 0, furthest: p.furthest || 0, answers: p.answers || {}, updated: Date.now() }))
      .catch(() => {});
    writing = writing.then(() => db.collection("data/users/" + uid).doc("last").set({ video: cur?.id || id })).catch(() => {});
  }
}
async function loadProgress() {
  const all = lsRead();
  for (const v of course.videos) progress[v.id] = all[v.id] || { pos: 0, furthest: 0, answers: {} };
  return all._last;
}
async function loadAccountProgress() {
  if (!db || !uid) return null;
  try {
    const snap = await Promise.race([db.collection("data/users/" + uid).get(), new Promise((_, r) => setTimeout(() => r(new Error("timeout")), 10000))]);
    let last = null;
    for (const d of snap.docs) {
      const x = d.data() || {};
      if (d.id === "last") { last = x.video; continue; }
      if (x.video && progress[x.video]) {
        const p = progress[x.video];

}

/* ---------- asking Claude ---------- */
function transcriptText(from, to, limit) {
  let s = "";

  return s.length > limit ? s.slice(0, limit) + "\n[…]" : s;
}

  return [
    `You are the tutor built into a video player for the course "${course.title}". The learner is watching "${cur.title}" and asks you about it. You get the video's full narration with timestamps, the exact moment they paused, the text on screen, and usually the current frame as an image (their red marks on it show what they mean).`,
    "How to answer:",
    "- Answer exactly what they asked, concisely. Build on what the video already showed and use its notation and examples; don't retell the video.",
    "- If they ask for a different explanation, use a genuinely different angle (an analogy, small concrete numbers, a picture in words) – not the same words reordered.",
    "- Never be condescending; assume a sharp learner who missed one step.",
    "- Refer to moments in this video as [m:ss] (they become clickable). If something is covered in another video of the course, name it.",

  return [
    `Paused at ${fmt(t)}${c ? ` in chapter "${c.title}"` : ""}.`,
    recent ? "Just said:\n" + recent : "Nothing said yet at this point.",

  const mic = $("mic"); mic.hidden = false;
  let base = "";
  d.onPartial(({ text }) => { $("ask-input").value = base + text; });
  d.onFinal(({ text }) => { base = (base + text + " "); $("ask-input").value = base; });
  d.onState(({ state, reason }) => {
    mic.setAttribute("aria-pressed", String(state === "listening" || state === "starting"));
    if (state === "idle" && (reason === "not_granted" || reason === "unavailable")) mic.hidden = true;
  });
  mic.onclick = () => {
    if (mic.getAttribute("aria-pressed") === "true") { d.stop().catch(() => {}); return; }
    base = $("ask-input").value ? $("ask-input").value + " " : "";
    if (!video.paused) video.pause();
    d.start().catch(() => {});
  };
}

/* ---------- tabs ---------- */
for (const [tab, panel] of [["tab-ask", "panel-ask"], ["tab-map", "panel-map"], ["tab-course", "panel-course"]]) {
  $(tab).onclick = () => {
    for (const [t2, p2] of [["tab-ask", "panel-ask"], ["tab-map", "panel-map"], ["tab-course", "panel-course"]]) { $(t2).setAttribute("aria-selected", String(t2 === tab)); $(p2).hidden = t2 !== tab; }
  };
}

/* ---------- start ---------- */
function applyStrings() {
  $("s-kicker").textContent = L.kicker; $("tab-ask").textContent = L.ask; $("tab-map").textContent = L.map; $("tab-course").textContent = L.course;
  $("s-draw").textContent = L.mark; $("draw-badge").textContent = L.drawBadge; $("ask-send").textContent = L.send; $("ask-stop").textContent = L.stop;
  $("s-frame").textContent = L.frame; $("s-stop").textContent = L.stopAtQ; $("ask-input").placeholder = L.placeholder;
  buildChips();
}
async function boot() {
  try {
    const r = await fetch("course.json"); if (!r.ok) throw new Error(r.status);
    course = await r.json();
  } catch {
    $("chat").textContent = ""; $("chat").append(el("div", "msg err", STR.en.loadError)); return;
  }
  L = STR[(course.language || "en").slice(0, 2)] || STR.en;
  document.documentElement.lang = course.language || "en";
  $("course-title").textContent = course.title;
  applyStrings(); buildPicker();
  const last = await loadProgress();
  const fromHash = course.videos.find((v) => hashId(v.id) === location.hash.slice(1))?.id;
  openVideo(fromHash || last || course.videos[0].id);
  window.addEventListener("hashchange", () => { const v = course.videos.find((x) => hashId(x.id) === location.hash.slice(1)); if (v && v.id !== cur?.id) openVideo(v.id); });
  window.addEventListener("pagehide", () => { if (cur) { progress[cur.id].pos = video.currentTime; saveProgress(cur.id); } });
  const use = (n) => (window.claude?.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
  use("sample").then(async (s) => {
    sample = s; sampleChecked = true;
    if (s) { const lim = await s.limits().catch(() => null); imagesOk = !!lim?.images; }
    $("with-frame").parentElement.hidden = !imagesOk;
    updateCtxLine(); renderChat();
  });
  use("dictation").then((d) => { dictation = d; setupDictation(d); });
  Promise.all([use("db"), use("user")]).then(async ([d, u]) => {
    if (!d || !u) return;
    uid = await u.id().catch(() => null); if (!uid) return;
    db = d;
    const last2 = await loadAccountProgress();
    buildCourse(); buildMap(); updateWhere(video.currentTime);
    if (!fromHash && last2 && last2 !== cur?.id && video.paused && video.currentTime < 1) openVideo(last2);
  });
}
boot();
</script>
